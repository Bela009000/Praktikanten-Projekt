<div class="page-wrapper"
    style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;">
    <div class="register-container">
        <h2>Registrieren</h2>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" [(ngModel)]="username" />
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" />
            </div>

            <button type="submit">Registrieren</button>
        </form>
        <p *ngIf="message" [style.color]="isSuccess ? 'green' : 'red'">{{ message }}</p>
        <p class="switch-link">Schon registriert? <a routerLink="/login">Zum Login</a></p>
    </div>
</div>
